name: Publish NuGet Packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.2.3). Leave blank to use Directory.Build.props."
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publishing: the job asks GitHub for an OIDC token, which nuget.org trades for a
    # short-lived API key (policy "ExzileGames.AndroidBridges CI" on nuget.org, owner jpongallo)
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: $(grep 'version=' "$GITHUB_OUTPUT" | tail -1)"

      - name: Pack AndroidBillingBridge
        run: |
          dotnet pack AndroidBillingBridge/AndroidBillingBridge.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./artifacts

      - name: Pack AndroidPlayGamesBridge
        run: |
          dotnet pack AndroidPlayGamesBridge/AndroidPlayGamesBridge.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./artifacts

      - name: Pack AndroidAdsBridge
        run: |
          dotnet pack AndroidAdsBridge/AndroidAdsBridge.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./artifacts

      - name: Pack AndroidReviewBridge
        run: |
          dotnet pack AndroidReviewBridge/AndroidReviewBridge.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./artifacts

      - name: Pack AndroidConsentBridge
        run: |
          dotnet pack AndroidConsentBridge/AndroidConsentBridge.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./artifacts

      - name: Pack AndroidFcmBridge
        run: |
          dotnet pack AndroidFcmBridge/AndroidFcmBridge.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./artifacts

      - name: Pack AndroidCrashlyticsBridge
        run: |
          dotnet pack AndroidCrashlyticsBridge/AndroidCrashlyticsBridge.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./artifacts

      - name: Pack AndroidAppUpdateBridge
        run: |
          dotnet pack AndroidAppUpdateBridge/AndroidAppUpdateBridge.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./artifacts

      - name: Pack AndroidAnalyticsBridge
        run: |
          dotnet pack AndroidAnalyticsBridge/AndroidAnalyticsBridge.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./artifacts

      - name: Pack AndroidRemoteConfigBridge
        run: |
          dotnet pack AndroidRemoteConfigBridge/AndroidRemoteConfigBridge.csproj \
            -c Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./artifacts

      - name: Log in to NuGet.org (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: jpongallo

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
